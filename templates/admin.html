{% include '_flash.html' %}<div class='container'><h2>Admin Dashboard</h2><div class='stats'>{% for k,v in stats.items() %}<div class='card'><h3>{{k}}</h3><p>{{v}}</p></div>{% endfor %}</div><form method='get' class='card inline'><input name='q' placeholder='Search'><select name='status'><option value='all'>All</option><option value='pending'>Pending</option><option value='approved'>Approved</option><option value='rejected'>Rejected</option></select><button class='btn'>Filter</button></form>{% for u in users %}<article class='card'><h3>{{u.full_name}} ({{u.uid}})</h3><p>Status: {{u.status}} | Role: {{u.role}} | Paid: {{u.paid}} | Banned: {{u.banned}}</p><form method='post' class='inline'><input type='hidden' name='target_uid' value='{{u.uid}}'><button name='action' value='approve' class='btn gold'>Approve</button><button name='action' value='reject' class='btn'>Reject</button><button name='action' value='ban' class='btn'>Ban</button><button name='action' value='unban' class='btn'>Unban</button></form><form method='post' class='inline'><input type='hidden' name='target_uid' value='{{u.uid}}'><select name='days'><option value='7'>7 days</option><option value='30'>30 days</option><option value='90'>90 days</option><option value='365'>1 year</option><option value='permanent'>permanent</option></select><button name='action' value='manual_access' class='btn gold'>Grant Manual Access</button><button name='action' value='revoke_manual_access' class='btn'>Revoke</button></form></article>{% endfor %}</div>
